<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UXbrain — Product Design Mastery Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UXbrain — a self-paced product design mastery curriculum, interview gym, flashcards, and reference platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .error-box { background: #fee; color: #c33; padding: 20px; margin: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div id="dos-root" class="dos" data-screen-label="UXbrain">
  <div style="padding: 20px; color: #999;">Initializing... (Updated: 2026-07-12 10:25 UTC)</div>
</div>

<div id="ux-intro">
  <canvas id="ux-intro-canvas"></canvas>
  <div class="ux-intro-inner">
    <div class="ux-intro-eyebrow">Learn &middot; Practice &middot; Grow</div>
    <h1 class="ux-intro-title">UXbrain</h1>
    <p class="ux-intro-tag">A calmer path to product-design mastery.</p>
    <button class="ux-intro-enter" id="ux-intro-enter" type="button">Enter <span aria-hidden="true">&rarr;</span></button>
    <div class="ux-intro-hint">click anywhere to enter</div>
  </div>
</div>
<script>
  // Returning visitor within the session: drop the intro before first paint.
  (function () { try { if (sessionStorage.getItem('uxbrain.intro.v1')) { var e = document.getElementById('ux-intro'); if (e) e.remove(); } } catch (_) {} })();
</script>

<script>
  const errorLog = [];

  window.addEventListener('error', (e) => {
    const msg = `ERROR: ${e.filename}:${e.lineno} - ${e.message}`;
    errorLog.push(msg);
    console.error(msg);
    updateErrors();
  });

  window.addEventListener('unhandledrejection', (e) => {
    const msg = `UNHANDLED PROMISE: ${e.reason}`;
    errorLog.push(msg);
    console.error(msg);
    updateErrors();
  });

  function updateErrors() {
    const root = document.getElementById('dos-root');
    if (errorLog.length > 0) {
      root.innerHTML = '<div class="error-box">ERRORS:\n\n' + errorLog.join('\n\n') + '</div>';
    }
  }

  setTimeout(() => {
    if (!window.__dos) {
      errorLog.push('TIMEOUT: App did not initialize after 8 seconds');
      updateErrors();
    }
  }, 8000);
</script>
<script>
  // Interactive cursor: a soft ring that trails the pointer and reacts to hovers.
  // Fine-pointer devices only (skipped on touch); additive, so the native cursor stays.
  (function () {
    if (!window.matchMedia || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ring = document.createElement('div'); ring.className = 'dos-cursor-ring'; ring.style.opacity = '0';
    var dot = document.createElement('div'); dot.className = 'dos-cursor-dot'; dot.style.opacity = '0';
    document.body.appendChild(ring); document.body.appendChild(dot);
    var mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, shown = false;
    var SEL = 'a,button,[data-act],[role="button"],input,textarea,select,label,summary';
    addEventListener('mousemove', function (e) {
      mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px';
      if (!shown) { shown = true; ring.style.opacity = ''; dot.style.opacity = ''; }
    }, { passive: true });
    addEventListener('mouseleave', function () { ring.style.opacity = '0'; dot.style.opacity = '0'; shown = false; });
    addEventListener('mousedown', function () { ring.classList.add('press'); }, { passive: true });
    addEventListener('mouseup', function () { ring.classList.remove('press'); }, { passive: true });
    addEventListener('mouseover', function (e) { if (e.target.closest && e.target.closest(SEL)) ring.classList.add('hover'); }, { passive: true });
    addEventListener('mouseout', function (e) {
      if (e.target.closest && e.target.closest(SEL)) { var to = e.relatedTarget; if (!to || !(to.closest && to.closest(SEL))) ring.classList.remove('hover'); }
    }, { passive: true });
    (function loop() {
      if (reduce) { rx = mx; ry = my; } else { rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18; }
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(loop);
    })();
  })();
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="intro.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
